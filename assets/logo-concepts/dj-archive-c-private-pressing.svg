    <circle cx="72" cy="72" r="55" fill="none" stroke="#1f1f2c" stroke-width="2"/>
    <circle cx="72" cy="72" r="42" fill="#e8a040"/>
    <circle cx="72" cy="72" r="31" fill="#111118"/>
