    <style>
      .word{font-family:Inter,Arial,sans-serif;font-size:35px;font-weight:780;letter-spacing:2.8px}
      .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;font-size:10.5px;font-weight:600;letter-spacing:2px}
    </style>
  </defs>
  <rect width="520" height="180" rx="18" fill="#0a0a0f"/>
  <g transform="translate(38 18)">
