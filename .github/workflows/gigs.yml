name: Refresh Gig Radar
on:
  schedule:
    - cron: '0 6 * * 4'   # Thursdays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch listings and rebuild gigs.html
        run: python3 gigs-fetch.py
      - name: Commit if changed
        run: |
          git config user.name "gig-radar-bot"
          git config user.email "actions@github.com"
          git add gigs.html gigs-share.html gigs-data.json
          git diff --cached --quiet && echo "No changes" || {
            git commit -m "Gig Radar weekly refresh"
            git push
          }
